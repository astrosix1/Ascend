name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage

  lint-and-typecheck:
    name: Lint & typecheck (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Non-blocking for now: the codebase has pre-existing lint/type findings
      # (92 lint problems, ~40 tsc errors as of 2026-09) that predate CI
      # existing at all. This still surfaces new issues on every PR without
      # blocking merges until those are worked down — flip continue-on-error
      # to false once the backlog is clear.
      - name: ESLint
        run: npm run lint
        continue-on-error: true
      - name: TypeScript
        run: npx tsc --noEmit
        continue-on-error: true

  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Non-blocking: several findings only resolve via a major Expo SDK bump
      # that needs its own dedicated, tested migration — see `npm audit`.
      - run: npm audit --omit=dev
        continue-on-error: true
